spring:
  application:
    name: voyageweaver-adk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/voyageweaver}
    username: ${DATABASE_USERNAME:voyageweaver}
    password: ${DATABASE_PASSWORD:voyageweaver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
voyage:
  ai:
    enabled: ${VOYAGE_AI_ENABLED:false}
    api-key: ${GOOGLE_API_KEY:disabled}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  security:
    api-key: ${VOYAGE_API_KEY:change-me-before-production}
