services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: voyageweaver
      POSTGRES_USER: voyageweaver
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes: ["voyage-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyageweaver"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/voyageweaver
      DATABASE_USERNAME: voyageweaver
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set VOYAGE_API_KEY}
      VOYAGE_AI_ENABLED: ${VOYAGE_AI_ENABLED:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-disabled}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
volumes:
  voyage-data:
